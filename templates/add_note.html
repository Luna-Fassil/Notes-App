{% extends "base.html" %}
{% block title %}Add Note{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Add a Note</h2>
<form method="POST" class="space-y-4">
  <input type="text" name="title" placeholder="Title" required class="w-full p-3 border rounded">
  <textarea name="content" placeholder="Content" required class="w-full p-3 border rounded" rows="6"></textarea>
  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Add</button>
</form>

{% endblock %}
