{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Reset Your Password</h2>
<form method="POST" class="space-y-4">
  <input type="password" name="new_password" placeholder="New password" required class="w-full p-3 border rounded">
  <input type="password" name="confirm_password" placeholder="Confirm password" required class="w-full p-3 border rounded">
  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Reset Password</button>
</form>
{% endblock %}
