{% extends "base.html" %}

{% block title %}Forgot Password - Notes App{% endblock %}

{% block content %}
  <h1 class="text-3xl font-bold mb-6">Forgot Password</h1>

  <form method="POST" class="max-w-md mx-auto bg-white p-6 rounded shadow">
    <label for="email" class="block mb-2 font-semibold">Enter your email address:</label>
    <input 
      type="email" 
      id="email" 
      name="email" 
      required 
      placeholder="you@example.com"
      class="w-full p-2 border border-gray-300 rounded mb-4"
    >
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
      Send Reset Link
    </button>
  </form>

  <p class="mt-4 text-center">
    <a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">Back to login</a>
  </p>
{% endblock %}
